function panel(kind){paused=true;$('#screen').classList.add('show');let sheet=$('#sheet');if(kind==='title'){sheet.innerHTML=`<h1>GODSHIFT<br>THE CRYSTAL EXPANSES</h1><p>Four vast scrolling realms. Vertical shafts and underworld tunnels. Secret routes, short circuits, guardian bosses and ten stackable god powers per hero. Unlock four additional champions by defeating guardians and finding secrets. Press H for heroes.</p><p><b>Movement:</b> arrows, Space to jump, Down + Space to drop, double-tap direction to sprint. <b>Attacks stay on the left side of the keyboard:</b> A S D F W E R Q Z X.</p><button id="resume">${state.cleared?'CONTINUE FREE PLAY':'BEGIN THE EXPEDITION'}</button> <button id="mapbtn">WORLD MAP</button> <button id="herobtn">HEROES</button><button id="reset">NEW GAME</button>`;$('#resume').onclick=resume;$('#mapbtn').onclick=()=>panel('map');$('#herobtn').onclick=()=>panel('heroes');$('#reset').onclick=()=>{if(confirm('Erase this expedition and begin again?')){localStorage.removeItem(SAVE);location.reload()}}}
else if(kind==='heroes'){sheet.innerHTML=`<h1>THE FIVE CHAMPIONS</h1><p>Defeat guardians and discover hidden relics to recruit heroes. Each has ten distinct, rapidly stackable abilities. Change heroes whenever you wish after unlocking them.</p><div class="grid">${HEROES.map((h,i)=>`<div class="tile" style="border-color:${h.color}"><h2>${h.name}</h2><p>${h.powers.join(' · ')}</p><p>${state.unlocked[i]?'UNLOCKED':h.unlock}</p><button data-hero="${i}" ${!state.unlocked[i]?'disabled':''}>${state.character===i?'CURRENT HERO':state.unlocked[i]?'PLAY AS '+h.name:'LOCKED'}</button></div>`).join('')}</div><button id="resume">RETURN</button>`;sheet.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>chooseHero(+b.dataset.hero));$('#resume').onclick=resume}
else if(kind==='forge'){sheet.innerHTML=`<h1>THE AETHER FORGE</h1><p>Every power remains spammable; upgrades improve radius and damage. Spend shards or forge points earned from guardians and hidden relics.</p><div class="grid">${POWER_NAMES.map((n,i)=>`<div class="tile"><b>${'ASDFWERQZX'[i]} · ${n}</b><p>Level ${state.levels[i]}/6</p><button data-up="${i}" ${state.levels[i]>=6?'disabled':''}>UPGRADE · ${120*(state.levels[i]+1)} ✦ OR 1 ⚒</button></div>`).join('')}</div><p>${state.shards} shards · ${state.points} forge points</p><button id="resume">RETURN</button>`;sheet.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{let i=+el.dataset.up,cost=120*(state.levels[i]+1);if(state.levels[i]>=6)return;if(state.shards>=cost)state.shards-=cost;else if(state.points>0)state.points--;else{message('NOT ENOUGH SHARDS OR POINTS');return}state.levels[i]++;save();panel('forge')});$('#resume').onclick=resume}
else if(kind==='map'){sheet.innerHTML=`<h1>THE EXPEDITION ATLAS</h1><p>Four vast connected regions. Every region contains a long main route, upper paths, lower tunnels and guardian spires. The guardian crest unlocks the eastern gate.</p><div class="grid">${BIOMES.map((b,i)=>`<div class="tile"><b>${i+1}. ${b.name}</b><p>${state.keys[i]?'✓ '+b.crest+' CLAIMED':'◈ '+b.boss+' STILL GUARDS ITS CREST'}</p><p>${i===state.zone?'YOU ARE HERE':i<state.zone?'VISITED':'AHEAD'}</p></div>`).join('')}</div><p>Current position: ${Math.round(hero.x)} east · ${Math.round(hero.y)} depth. Guardian spire around x=6,000 on the uppermost road; exit gate around x=6,860 on the central road.</p><button id="resume">RETURN</button>`;$('#resume').onclick=resume}
else if(kind==='win'){sheet.innerHTML=`<h1>THE CROWN REFORGED</h1><p>You recovered all four crests, defeated the guardians and crossed the Shattered Expanses. The wilds, foundries, archives and starfall keep are no longer severed from one another.</p><h2>CAMPAIGN COMPLETE</h2><p>${state.kills} enemies defeated · ${state.shards} unspent shards · ${state.keys.filter(Boolean).length}/4 crests</p><button id="resume">CONTINUE FREE EXPLORATION</button><button id="reset">START OVER</button>`;$('#resume').onclick=resume;$('#reset').onclick=()=>{localStorage.removeItem(SAVE);location.reload()}}
else {sheet.innerHTML=`<h1>CONTROLS & ROUTES</h1><p>← → move; double-tap either direction for extreme speed. ↑ or Space jumps. Wall jump off vertical surfaces. Hold ↓ and jump to pass through thin ledges. J slashes, K heavy slashes. Stand beside a pedestal and press C (or mobile USE) to interact. Waystones save your checkpoint and refill health; the floating crystal is decorative, so you do not need to jump to it. C also operates switches, secret relics and the crest gate.</p><p>H opens character selection. Each hero has unique powers mapped to A S D F W E R Q Z X. The starting hero uses: A Mountain · S Lightning · D Solar Beam · F Meteors · W Gravity · E Freeze · R Nova · Q Sword Storm · Z Void · X Sanctuary. Powers have virtually no cooldown and can be stacked in rapid succession. Upgrade them in the Forge.</p><p>Explore upper balconies and descend through floor gaps into lower tunnels. The eastern guardian is above the main road. The crest gate is below it; backtrack after the fight.</p><button id="resume">RETURN</button>`;$('#resume').onclick=resume}}
function resume(){paused=false;$('#screen').classList.remove('show')}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=true;if(e.code==='Escape'){if(paused)resume();else panel('help');return}if(e.code==='KeyM'){panel('map');return}if(e.code==='KeyB'){panel('forge');return}if(e.code==='KeyH'){panel('heroes');return}if(paused)return;if(e.code==='ArrowLeft'||e.code==='ArrowRight'){if(lastTap[e.code]&&time-lastTap[e.code]<.28){hero.run=.95;message('HYPER RUN',.5)}lastTap[e.code]=time}if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='KeyC')interact();if(e.code==='KeyJ')slash();if(e.code==='KeyK')slash(true);let i=PKEYS.indexOf(e.code);if(i>=0)heroPower(i)});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={}});
function mobile(){const p=$('#powers');PKEYS.forEach((key,i)=>{let btn=document.createElement('button');btn.textContent=key[3]+' '+POWER_NAMES[i].slice(0,3);btn.onpointerdown=e=>{e.preventDefault();heroPower(i)};p.append(btn)});document.querySelectorAll('[data-hold]').forEach(btn=>{let code=btn.dataset.hold;btn.onpointerdown=e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);keys[code]=true;let tick=performance.now();if(btn._last&&tick-btn._last<320)hero.run=.95;btn._last=tick};btn.onpointerup=btn.onpointercancel=e=>{keys[code]=false}});document.querySelectorAll('[data-tap]').forEach(btn=>{btn.onpointerdown=e=>{e.preventDefault();let k=btn.dataset.tap;if(k==='jump')jump();else if(k==='drop'){keys.ArrowDown=true;jump();keys.ArrowDown=false}else if(k==='interact')interact();else if(k==='slash')slash();else if(k==='heavy')slash(true);else if(k==='dash')hero.run=1.1;else panel(k)}})}mobile();refreshPowers();

for(const m of maps){for(const br of m.bridges){let obj=P(br.x,br.y,br.w,br.h,'one');Object.defineProperty(obj,'w',{get(){return state.found[m.z+br.id]?br.w:0}});m.platforms.push(obj)}}
map=maps[state.zone];boss=map.boss;hero.x=clamp(state.x,80,MAP_W-170);hero.y=state.y>20?state.y:1060;cam.x=hero.x-vw*.4;cam.y=hero.y-vh*.5;panel('title');requestAnimationFrame(frame);
</script></body></html>
